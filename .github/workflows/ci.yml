name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Fetch real-world corpus
        shell: bash
        run: bash scripts/fetch-real-world-corpus.sh
      - name: Build and test
        shell: bash
        run: ./mvnw -B -ntp verify
      - name: Smoke test the drop-in workflow (jar next to the PL/SQL files, no arguments)
        shell: bash
        run: |
          mkdir drop
          printf 'create or replace procedure b_proc is\nbegin\n  null;\nend;\n/\n' > drop/b_proc.prc
          printf 'create or replace procedure a_proc is\nbegin\n  b_proc;\nend;\n/\n' > drop/a_proc.prc
          cp target/plsql-atlas.jar drop/
          (cd drop && java -jar plsql-atlas.jar --no-ui)
          test -f drop/.agentdocs/analysis/verification.md
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: plsql-atlas-jar
          path: target/plsql-atlas.jar
